<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Admin — Event Info</title>
</head>
<body>
    <div class="container py-5" style="max-width: 600px">
        <h1 class="mb-4">Event Info</h1>

        <div th:if="${eventInfo.launched}" class="alert alert-success">
            This event has already been launched. Registration is locked.
        </div>

        <form th:action="@{/admin/event/save}" th:object="${eventInfo}" method="post" class="mb-4">
            <div class="mb-3">
                <label class="form-label">Event Title</label>
                <input type="text" name="title" th:field="*{title}" class="form-control" placeholder="e.g. Symbiosis 2025">
            </div>
            <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" name="date" class="form-control"
                    th:value="${eventInfo.startDateTime != null ? #temporals.format(eventInfo.startDateTime, 'yyyy-MM-dd') : ''}">
            </div>
            <div class="row mb-3">
                <div class="col">
                    <label class="form-label">Start Time</label>
                    <input type="time" name="startTime" class="form-control"
                        th:value="${eventInfo.startDateTime != null ? #temporals.format(eventInfo.startDateTime, 'HH:mm') : ''}">
                </div>
                <div class="col">
                    <label class="form-label">End Time</label>
                    <input type="time" name="endTime" class="form-control"
                        th:value="${eventInfo.endDateTime != null ? #temporals.format(eventInfo.endDateTime, 'HH:mm') : ''}">
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
        </form>

        <hr>

        <form th:action="@{/admin/event/launch}" method="post">
            <button type="submit" class="btn btn-danger"
                th:disabled="${eventInfo.launched}"
                onclick="return confirm('Launch the event now? This will register all users and cannot be undone.')">
                Launch Event Now
            </button>
        </form>
    </div>
</body>
</html>
