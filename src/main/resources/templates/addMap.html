<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Map | Symbiosis</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/addMap.css">
    
    <script src="/js/addMap.js" defer></script>
</head>
<body>
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <main class="maps-layout">
        <nav class="topbar">
            <a href="/home" class="topbar-brand">Symbiosis</a>
        </nav>

        <div class="maps-container">
            <div class="page-header">
                <h1>Add Map</h1>
            </div>

            <div th:if="${error}" class="flash-error" th:text="${error}"></div>

            <div class="form-card">
                <form th:action="@{/maps/add}" method="post">
                    <div class="form-group">
                        <label>Map File</label>
                        <label for="file" class="file-upload-area" id="fileLabel">
                            <div class="file-upload-icon">📁</div>
                            <div class="file-upload-text">Click to choose a file</div>
                            <p class="file-hint">PDF, JPEG, or PNG</p>
                            <input type="file" id="file" accept=".pdf,.jpg,.jpeg,.png" style="display:none" onchange="handleFileSelected(this)">
                        </label>
                        <p class="file-name-display" id="fileNameDisplay"></p>
                        <p id="uploadStatus" style="font-size:0.82rem; color: var(--sage); margin-top:6px;"></p>
                        <input type="hidden" id="imgUrlField" name="fileUrl">
                        <input type="hidden" id="fileType" name="fileType">
                    </div>

                    <div class="form-group">
                        <label for="title">Map Title</label>
                        <input type="text" id="title" name="title" placeholder="e.g. Conference Centre Overview">
                    </div>

                    <div class="form-group">
                        <label for="floorLevel">Floor Level</label>
                        <input type="text" id="floorLevel" name="floorLevel" placeholder="e.g. Floor 3, Main Lobby">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-accent">Save Changes</button>
                        <a th:href="@{/maps}" class="btn-ghost">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
