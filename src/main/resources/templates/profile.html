<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/profile.css">
    <title>Profile — Symbiosis</title>
</head>

<body>

    <nav class="topbar">
        <a href="#" class="topbar-brand">Symbiosis</a>
    </nav>

    <main>
        <!-- User info and logout -->
        <section>
            <h1 th:text="${user.firstName} + ' ' + ${user.lastName}">profile</h1>
            <h2 th:text="${user.email}"></h2>
            <form action="/auth/logout" method="post">
                <button class="btn-secondary logout">Log Out</button>
            </form>
        </section>

        <div class="divider"></div>

        <!-- Posts -->
        <section class="container-fluid">
            <div class="row">
                <img th:each="post: ${posts}" th:src="${post.img}" alt="User post" class="post col-4">
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
