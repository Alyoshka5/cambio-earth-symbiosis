<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking | Symbiosis</title>

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/ranking.css">
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="page-layout">
        <nav class="topbar">
            <a href="/home" class="topbar-brand">Symbiosis</a>
        </nav>

        <div class="page-shell">
            <header class="page-header">
                <div class="page-header-text">
                    <h1 class="title-jura">Ranking</h1>
                </div>
                <form action="/missions" method="get">
                    <button type="submit" class="add-session-button">Missions</button>
                </form>
            </header>

            <p th:if="${errorMessage != null}" class="ranking-error" th:text="${errorMessage}"></p>

            <div class="participant-card ranking-card">
                <div class="ranking-row ranking-header">
                    <div>Participant</div>
                    <div>Points</div>
                    <div>Rank</div>
                </div>

                <div th:if="${users != null}" th:each="user, stat : ${users}" class="ranking-row">
                    <div class="participant-cell">
                        <div class="participant-avatar">
                            <span th:text="${#strings.substring(user.firstName, 0, 1).toUpperCase()}">A</span>
                        </div>
                        <span class="ranking-name" th:text="${user.firstName + ' ' + user.lastName}">Name</span>
                    </div>
                    <div class="ranking-points" th:text="${user.points == null ? 0 : user.points}">100</div>
                    <div class="ranking-rank" th:text="${stat.index + 1}">1</div>
                </div>

                <div class="ranking-current-user">
                    <span>Your Rank:</span>
                    <strong th:text="${rank}">N/A</strong>
                    <span class="ranking-divider" th:if="${currentUser != null}">•</span>
                    <span th:if="${currentUser != null}">Points:</span>
                    <strong th:if="${currentUser != null}" th:text="${currentUser.points == null ? 0 : currentUser.points}">0</strong>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
