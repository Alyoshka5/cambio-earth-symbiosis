<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Sidebar Css -->
    <link href="/css/sidebar.css" rel="stylesheet">
    
    <!-- Styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="/css/profileEditForm.css" rel="stylesheet">
    <title>Edit Profile</title>
</head>

<body>

    <!-- Sidebar -->
    <div th:if="${showSidebar}" th:replace="fragments/sidebar :: sidebar"></div>

    <!-- Main Content Wrapper -->
    <div class="page-content">

        <!-- Top bar -->
        <nav class="topbar">
            <a href="/home" class="topbar-brand">Symbiosis</a>
            <a href="/profile" class="topbar-back">
                <span class="back-arrow">←</span> Profile
            </a>
        </nav>

        <div class="page-wrapper">

            <!-- Header -->
            <div class="page-header">
                <h1>Edit Profile</h1>
                <div class="header-line"></div>
            </div>

            <!-- Form Card -->
            <div class="form-card">
                <form th:action="@{/profile/save}" th:object="${user}" method="post" id="profileForm">

                    <!-- Basic Info -->
                    <div class="section-label">Basic Info</div>

                    <div class="mb-3">
                        <label class="form-label" for="title">
                            First Name
                        </label>
                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            th:field="*{firstName}"
                            class="form-control"
                        >
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="title">
                            Last Name
                        </label>
                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            th:field="*{lastName}"
                            class="form-control"
                        >
                    </div>

                    <!-- Password -->
                    <div class="section-label">Change Password</div>

                    <div class="mb-3">
                        <label class="form-label" for="title">
                            Current Password
                        </label>
                        <input
                            type="text"
                            id="currentPassword"
                            name="currentPassword"
                            class="form-control"
                        >
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="title">
                            New Password
                        </label>
                        <input
                            type="text"
                            id="newPassword"
                            name="newPassword"
                            class="form-control"
                        >
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="title">
                            Confirm New Password
                        </label>
                        <input
                            type="text"
                            id="confirmNewPassword"
                            name="confirmNewPassword"
                            class="form-control"
                        >
                    </div>

                    <div class="form-actions">
                        <a href="/profile" class="btn-cancel">Cancel</a>
                        <button type="submit" class="btn-save">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
