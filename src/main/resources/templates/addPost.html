<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Post | Symbiosis</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/addPost.css">
    
    <script src="/js/addPost.js" defer></script>
</head>
<body>
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="post-form-layout">
        <nav class="topbar">
            <a href="/home" class="topbar-brand">Symbiosis</a>
            <a href="/home" class="topbar-back">
                <span class="back-arrow">←</span> Home
            </a>
        </nav>

        <div class="page-wrapper">
            <div class="page-header">
                <h1>Add a Post</h1>
                <div class="header-line"></div>
                <p>Share something with the community. Fields marked <span style="color:var(--accent)">✦</span> are required.</p>
            </div>

            <div class="form-card">
                <form th:action="@{/posts/add}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="title">Title: <span class="required">✦</span></label>
                        <input type="text" id="title" name="title" class="form-control" placeholder="Give your post a title…" maxlength="75" oninput="updateCounter(this, 'titleCounter', 75)">
                        <div class="char-counter"><span id="titleCounter">0</span> / 75</div>
                        <p class="error-message" th:if="${titleErr}" th:text="${titleErr}"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="caption">Caption:</label>
                        <input class="form-control" type="text" id="caption" name="caption" placeholder="What do you want to share with the community?" maxlength="200" oninput="updateCounter(this, 'captionCounter', 200)">
                        <div class="char-counter"><span id="captionCounter">0</span> / 200</div>
                        <p class="error-message" th:if="${captionErr}" th:text="${captionErr}"></p>
                    </div>
                    
                    <div class="section-label">Image: <span class="required">✦</span></div>
                    <div class="mb-3">
                        <label class="form-label" for="image">Upload an image to post:</label>
                        <div class="file-upload-area" id="uploadArea">
                            <input class="form-control" type="file" id="image" accept=".jpg,.jpeg,.png,.webp">
                            <div class="upload-icon"><img src="/images/upload-icon.png" alt="upload icon"></div>
                            <div class="upload-label"><strong>Click to upload</strong> or drag &amp; drop</div>
                            <div class="upload-hint">PNG, JPG, JPEG, or WEBP</div>
                        </div>
                        <div class="file-preview-container" id="filePreviewContainer">
                            <div class="file-preview" id="filePreview">
                                <img id="previewImg" src="" alt="Preview">
                                <div class="file-preview-name">
                                    <span id="fileName">filename.jpg</span>
                                    <button type="button" class="btn-clear-file" onclick="clearFile()">Remove</button>
                                </div>
                            </div>
                        </div>
                        <div id="spinner" style="display:none">
                            <div class="d-flex justify-content-center">
                                <div class="spinner-border" role="status">
                                    <span class="visually-hidden">Uploading...</span>
                                </div>
                            </div>
                        </div>
                        <input type="hidden" id="imgUrl" name="img"/>
                        <p class="status-message" id="imgStatus"></p>
                        <p class="error-message" th:if="${imgErr}" th:text="${imgErr}"></p>
                        <p class="error-message" th:if="${imgFormatErr}" th:text="${imgFormatErr}"></p>
                    </div>
                    <div class="submit-btn">
                        <button class="btn-save" type="submit">Publish changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
