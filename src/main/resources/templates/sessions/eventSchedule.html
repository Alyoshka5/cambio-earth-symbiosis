<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/eventSchedule.css">
    <title>Event Schedule</title>
</head>
<body>
    <nav class="topbar">
        <a href="#" class="topbar-brand">Symbiosis</a>
        <a th:if="${isAdmin}" href="/admin/event" class="topbar-link">
            Event Settings
        </a>
        <a th:if="${isAdmin}" href="#" class="topbar-link" data-bs-toggle="modal" data-bs-target="#modal">
            Launch Event
        </a>
    </nav>

    <main>
        <header class="page-header">
            <h1 class="title-jura">Schedule</h1>
            <form th:if="${isAdmin}" action="/admin/sessions/new" method="get">
                <button type="submit" class="add-session-button">Add Session</button>
            </form>
        </header>
        <section th:each="scheduleDay: ${schedule}" class="container">
            <section class="container-fluid">
                <header class="day-header">
                    <h2 th:text="${scheduleDay.key.split('-')[0]}"></h2>
                    <h3 th:text="${scheduleDay.key.split('-')[1]}"></h3>
                </header>
                <article th:each="eventSession: ${scheduleDay.value}" class="session row">
                    <p th:text="${eventSession.getTimeRange()}" class="time-range col-12 col-lg-3"></p>
                    <div class="schedule-card col-12 col-lg-9">
                        <div>
                            <header th:switch="${eventSession.isBreakout()}">
                                <div th:case="true">
                                    <h4>Breakout Block</h4>
                                    <h5 th:text="${eventSession.getTitle()}"></h5>
                                    <div class="content-seperator"></div>
                                </div>
                                <div th:case="false">
                                    <h4 th:text="${eventSession.getTitle()}"></h4>
                                    <div class="content-seperator"></div>
                                </div>
                            </header>
                            <div class="info-container">
                                <img src="/images/location-icon.svg" alt="Location icon" class="icon">
                                <p th:text="${eventSession.getLocation()}"></p>
                            </div>
                            <div th:if="${eventSession.getSpeakersString().length() > 0}" class="info-container">
                                <img src="/images/person-icon.svg" alt="Person icon" class="icon">
                                <div>
                                    <p th:text="${eventSession.getSpeakersString()}"></p>
                                </div>
                            </div>
                            <a th:href="${'/sessions/' + eventSession.getId()}" class="card-link"><span class="card-link-span"></span></a>
                        </div>
                        <img src="/images/arrow-icon.svg" alt="Right arrow icon" class="icon arrow-icon">
                    </div>
                </article>
            </section>
        </section>
    </main>
    <div class="modal fade" id="modal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content-container">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="modalLabel">Ready to launch?</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        Launching the event will register participants for their sessions and will permit them to view their schedule and create posts.
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <form action="/admin/event/launch" method="post">
                            <button type="submit" class="btn btn-primary">Launch</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
