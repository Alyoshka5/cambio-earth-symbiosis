<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participants - Symbiosis</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- Global + sidebar theme -->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/sidebar.css">

    <style>
        body {
            background-color: var(--bark);
            background-image:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(107,143,113,0.18) 0%, transparent 70%),
                repeating-linear-gradient(
                    0deg, transparent, transparent 60px,
                    rgba(255,255,255,0.015) 60px, rgba(255,255,255,0.015) 61px
                );
            color: var(--cream);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            margin: 0; padding: 0;
        }

        .page-layout {
            margin-left: 250px;
            min-height: 100vh;
        }

        .page-shell {
            padding: 36px 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        /* -- Top bar -- */
        .topbar-back {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: var(--sage);
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .topbar-back:hover {
            color: var(--white);
        }
        
        .back-arrow {
            font-size: 1rem;
            line-height: 1;
        }

        /* ── Header ── */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
            gap: 16px;
        }

        .page-title-wrap h1 {
            font-family: "DM Serif Display", serif;
            font-size: 2.3rem;
            color: var(--white);
            margin: 0;
            line-height: 1.1;
        }

        .page-title-wrap p {
            color: var(--sage);
            margin: 8px 0 0;
            font-size: 0.98rem;
        }

        .participant-count-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(58, 79, 44, 0.6);
            border: 1px solid rgba(168, 197, 160, 0.2);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 0.85rem;
            color: var(--sage);
            white-space: nowrap;
            margin-top: 6px;
        }

        .participant-count-badge strong {
            color: var(--white);
        }

        /* ── Search bar ── */
        .search-wrap {
            margin-bottom: 24px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            pointer-events: none;
            opacity: 0.5;
        }

        .search-input {
            width: 100%;
            background: rgba(43, 57, 48, 0.96);
            border: 1px solid rgba(168, 197, 160, 0.16);
            border-radius: 999px;
            padding: 13px 18px 13px 44px;
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input::placeholder {
            color: rgba(168, 197, 160, 0.45);
        }

        .search-input:focus {
            border-color: rgba(168, 197, 160, 0.42);
            box-shadow: 0 0 0 3px rgba(168, 197, 160, 0.08);
        }

        /* ── Filter tabs ── */
        .filter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-tab {
            background: rgba(43, 57, 48, 0.7);
            border: 1px solid rgba(168, 197, 160, 0.14);
            border-radius: 999px;
            padding: 7px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            color: var(--sage);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tab:hover,
        .filter-tab.active {
            background: rgba(58, 79, 44, 0.9);
            border-color: rgba(168, 197, 160, 0.35);
            color: var(--white);
        }

        /* ── Participant grid ── */
        .participants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .participant-card {
            background: rgba(43, 57, 48, 0.96);
            border: 1px solid rgba(168, 197, 160, 0.14);
            border-radius: 18px;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
        }

        .participant-card:hover {
            transform: translateY(-3px);
            border-color: rgba(168, 197, 160, 0.32);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Avatar circle with initials */
        .participant-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--forest-light), var(--forest));
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        /* Give admins a distinct accent ring */
        .participant-avatar.admin-avatar {
            background: linear-gradient(135deg, #7a9e6e, #3a4f2c);
            box-shadow: 0 0 0 2px rgba(168, 197, 160, 0.45);
        }

        .participant-info {
            flex: 1;
            min-width: 0;
        }

        .participant-name {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: var(--white);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .participant-email {
            margin: 3px 0 0;
            font-size: 0.82rem;
            color: var(--sage);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Role badge */
        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border-radius: 999px;
            padding: 4px 11px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            align-self: flex-start;
        }

        .role-badge.admin {
            background: rgba(168, 197, 160, 0.14);
            border: 1px solid rgba(168, 197, 160, 0.28);
            color: #a8c5a0;
        }

        .role-badge.user {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--sage);
        }

        /* View profile link at card bottom */
        .card-footer-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid rgba(168, 197, 160, 0.1);
            color: var(--sage);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .participant-card:hover .card-footer-link {
            color: var(--white);
        }

        .arrow-icon {
            font-size: 0.8rem;
            transition: transform 0.2s;
        }

        .participant-card:hover .arrow-icon {
            transform: translateX(4px);
        }

        /* ── Empty state ── */
        .empty-state {
            background: rgba(58, 79, 44, 0.25);
            border: 1px dashed rgba(168, 197, 160, 0.25);
            border-radius: 18px;
            padding: 56px 24px;
            text-align: center;
            color: var(--sage);
            grid-column: 1 / -1;
        }

        .empty-state h3 {
            font-family: "DM Serif Display", serif;
            color: var(--white);
            margin-bottom: 10px;
        }

        /* ── No-results (JS driven) ── */
        .no-results-msg {
            display: none;
            color: var(--sage);
            text-align: center;
            padding: 40px 0;
            font-size: 0.95rem;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .page-layout {
                margin-left: 0;
            }

            .page-header {
                flex-direction: column;
                gap: 8px;
            }

            .page-title-wrap h1 {
                font-size: 1.8rem;
            }

            .participants-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <main class="page-layout">
        <nav class="topbar">
            <a href="/home" class="topbar-brand">Symbiosis</a>
            <a href="/home" class="topbar-back">
                <span class="back-arrow">←</span> Home
            </a>
        </nav>

        <div class="page-shell">

            <!-- Header -->
            <div class="page-header">
                <div class="page-title-wrap">
                    <h1>Participants</h1>
                    <p>Everyone taking part in the Symbiosis community.</p>
                    <span class="participant-count-badge">
                        <strong th:text="${#lists.size(participants)}">0</strong>&nbsp;members
                    </span>
                </div>
            </div>

            <!-- Search -->
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search by name or email…"
                    autocomplete="off"
                >
            </div>

            <!-- Filter tabs (only admins see the "Admins only" tab) -->
            <div class="filter-row" id="filterRow">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="user" th:if="${isAdmin}">Users</button>
                <button class="filter-tab" data-filter="admin" th:if="${isAdmin}">Admins</button>
            </div>

            <!-- Participant grid -->
            <div class="participants-grid" id="participantsGrid">

                <!-- Each card is a link to that user's profile -->
                <a
                    th:each="p : ${participants}"
                    th:href="@{'/profile/' + ${p.id}}"
                    class="participant-card"
                    th:attr="
                        data-name=${p.firstName + ' ' + p.lastName},
                        data-email=${p.email},
                        data-role=${p.role.toString().toLowerCase()}
                    "
                >
                    <div class="card-top">
                        <div class="participant-avatar"
                             th:classappend="${p.role.toString() == 'ADMIN'} ? ' admin-avatar' : ''"
                             th:text="${p.firstName != null and !#strings.isEmpty(p.firstName)} ? ${#strings.substring(p.firstName,0,1)} : 'U'">
                            U
                        </div>

                        <div class="participant-info">
                            <h3 class="participant-name"
                                th:text="${p.firstName + ' ' + p.lastName}">
                                Full Name
                            </h3>
                            <p class="participant-email" th:text="${p.email}">
                                email@example.com
                            </p>
                        </div>
                    </div>

                    <!-- Role badge – only visible to admins -->
                    <span th:if="${isAdmin}"
                          class="role-badge"
                          th:classappend="${p.role.toString() == 'ADMIN'} ? ' admin' : ' user'"
                          th:text="${#strings.toLowerCase(p.role.toString())}">
                        user
                    </span>

                    <div class="card-footer-link">
                        <span>View profile</span>
                        <span class="arrow-icon">→</span>
                    </div>
                </a>

                <!-- Empty state when no users exist at all -->
                <div class="empty-state" th:if="${participants == null or #lists.isEmpty(participants)}">
                    <h3>No participants yet</h3>
                    <p>Users will appear here once they join the community.</p>
                </div>

            </div>

            <!-- No-results message (shown via JS when search/filter yields nothing) -->
            <p class="no-results-msg" id="noResultsMsg">No participants match your search.</p>

        </div>
    </main>

    <script>
        const searchInput   = document.getElementById('searchInput');
        const filterRow     = document.getElementById('filterRow');
        const grid          = document.getElementById('participantsGrid');
        const noResults     = document.getElementById('noResultsMsg');
        const cards         = Array.from(grid.querySelectorAll('.participant-card'));

        let activeFilter = 'all';

        // ── Filter tabs ──────────────────────────────────────────
        filterRow.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                filterRow.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                activeFilter = tab.dataset.filter;
                applyFilters();
            });
        });

        // ── Search ───────────────────────────────────────────────
        searchInput.addEventListener('input', applyFilters);

        // ── Combined filter + search ─────────────────────────────
        function applyFilters() {
            const query = searchInput.value.trim().toLowerCase();
            let visible = 0;

            cards.forEach(card => {
                const name  = (card.dataset.name  || '').toLowerCase();
                const email = (card.dataset.email || '').toLowerCase();
                const role  = (card.dataset.role  || '').toLowerCase();

                const matchesSearch = !query || name.includes(query) || email.includes(query);
                const matchesFilter = activeFilter === 'all' || role === activeFilter;

                if (matchesSearch && matchesFilter) {
                    card.style.display = '';
                    visible++;
                } else {
                    card.style.display = 'none';
                }
            });

            noResults.style.display = visible === 0 && cards.length > 0 ? 'block' : 'none';
        }
    </script>
</body>
</html>
