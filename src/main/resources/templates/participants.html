<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participants - Symbiosis</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- Global + sidebar theme -->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/participants.css">

    <script src="/js/participants.js" defer></script>
    
</head>

<body>
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <main class="page-layout">
        <nav class="topbar">
            <a href="/home" class="topbar-brand">Symbiosis</a>
            <a href="/home" class="topbar-back">
                <span class="back-arrow">←</span> Home
            </a>
        </nav>

        <div class="page-shell">

            <!-- Header -->
            <div class="page-header">
                <div class="page-title-wrap">
                    <h1>Participants</h1>
                    <p>Everyone taking part in the Symbiosis community.</p>
                    <span class="participant-count-badge">
                        <strong th:text="${#lists.size(participants)}">0</strong>&nbsp;members
                    </span>
                </div>
            </div>

            <!-- Search -->
            <div class="search-wrap">
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="🔍 Search by name or email…"
                    autocomplete="off"
                >
            </div>

            <!-- Filter tabs (only admins see the "Admins only" tab) -->
            <div class="filter-row" id="filterRow">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="user" th:if="${isAdmin}">Users</button>
                <button class="filter-tab" data-filter="admin" th:if="${isAdmin}">Admins</button>
            </div>

            <!-- Participant grid -->
            <div class="participants-grid" id="participantsGrid">

                <!-- Each card is a link to that user's profile -->
                <a
                    th:each="p : ${participants}"
                    th:href="@{'/profile/' + ${p.id}}"
                    class="participant-card"
                    th:attr="
                        data-name=${p.firstName + ' ' + p.lastName},
                        data-email=${p.email},
                        data-role=${p.role.toString().toLowerCase()}
                    "
                >
                    <div class="card-top">
                        <div class="participant-avatar"
                             th:classappend="${p.role.toString() == 'ADMIN'} ? ' admin-avatar' : ''"
                             th:text="${p.firstName != null and !#strings.isEmpty(p.firstName)} ? ${#strings.substring(p.firstName,0,1)} : 'U'">
                            U
                        </div>

                        <div class="participant-info">
                            <h3 class="participant-name"
                                th:text="${p.firstName + ' ' + p.lastName}">
                                Full Name
                            </h3>
                            <p class="participant-email" th:text="${p.email}">
                                email@example.com
                            </p>
                        </div>
                    </div>

                    <!-- Role badge – only visible to admins -->
                    <span th:if="${isAdmin}"
                          class="role-badge"
                          th:classappend="${p.role.toString() == 'ADMIN'} ? ' admin' : ' user'"
                          th:text="${#strings.toLowerCase(p.role.toString())}">
                        user
                    </span>

                    <div class="card-footer-link">
                        <span>View profile</span>
                        <span class="arrow-icon">→</span>
                    </div>
                </a>

                <!-- Empty state when no users exist at all -->
                <div class="empty-state" th:if="${participants == null or #lists.isEmpty(participants)}">
                    <h3>No participants yet</h3>
                    <p>Users will appear here once they join the community.</p>
                </div>

            </div>

            <!-- No-results message (shown via JS when search/filter yields nothing) -->
            <p class="no-results-msg" id="noResultsMsg">No participants match your search.</p>

        </div>
    </main>

</body>
</html>
