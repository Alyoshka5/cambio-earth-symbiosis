<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participants - Symbiosis</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/sidebar.css">

    <style>
        body {
            background-color: var(--bark);
            background-image:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(107,143,113,0.18) 0%, transparent 70%),
                repeating-linear-gradient(
                    0deg, transparent, transparent 60px,
                    rgba(255,255,255,0.015) 60px, rgba(255,255,255,0.015) 61px
                );
            color: var(--cream);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            margin: 0; padding: 0;
        }

        .page-layout {
            margin-left: 250px;
            min-height: 100vh;
        }

        .page-shell {
            padding: 36px 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        .topbar-back {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: var(--sage);
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .topbar-back:hover {
            color: var(--white);
        }
        
        .back-arrow {
            font-size: 1rem;
            line-height: 1;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
            gap: 16px;
        }

        .page-title-wrap h1 {
            font-family: "DM Serif Display", serif;
            font-size: 2.3rem;
            color: var(--white);
            margin: 0;
            line-height: 1.1;
        }

        .page-title-wrap p {
            color: var(--sage);
            margin: 8px 0 0;
            font-size: 0.98rem;
        }

        .participant-count-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(58, 79, 44, 0.6);
            border: 1px solid rgba(168, 197, 160, 0.2);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 0.85rem;
            color: var(--sage);
            white-space: nowrap;
            margin-top: 6px;
        }

        .participant-count-badge strong {
            color: var(--white);
        }

        .search-wrap {
            margin-bottom: 24px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            pointer-events: none;
            opacity: 0.5;
        }

        .search-input {
            width: 100%;
            background: rgba(43, 57, 48, 0.96);
            border: 1px solid rgba(168, 197, 160, 0.16);
            border-radius: 999px;
            padding: 13px 18px 13px 44px;
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input::placeholder {
            color: rgba(168, 197, 160, 0.45);
        }

        .search-input:focus {
            border-color: rgba(168, 197, 160, 0.42);
            box-shadow: 0 0 0 3px rgba(168, 197, 160, 0.08);
        }

        .filter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-tab {
            background: rgba(43, 57, 48, 0.7);
            border: 1px solid rgba(168, 197, 160, 0.14);
            border-radius: 999px;
            padding: 7px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            color: var(--sage);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tab:hover,
        .filter-tab.active {
            background: rgba(58, 79, 44, 0.9);
            border-color: rgba(168, 197, 160, 0.35);
            color: var(--white);
        }

        .participants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .participant-card {
            position: relative;
            background: rgba(43, 57, 48, 0.96);
            border: 1px solid rgba(168, 197, 160, 0.14);
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .participant-card:hover {
            transform: translateY(-3px);
            border-color: rgba(168, 197, 160, 0.32);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
        }

        .card-link {
            text-decoration: none;
            display: block;
            padding: 20px 18px;
        }

        .card-menu {
            position: absolute;
            top: 16px;
            right: 18px;
            z-index: 10;
        }

        .menu-dots {
            background: rgba(43, 57, 48, 0.96);
            border: 1px solid rgba(168, 197, 160, 0.2);
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            color: var(--sage);
            padding: 4px 8px;
            line-height: 1;
            transition: all 0.2s;
        }

        .menu-dots:hover {
            background: rgba(58, 79, 44, 0.9);
            color: var(--white);
            border-color: rgba(168, 197, 160, 0.4);
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: rgba(43, 57, 48, 0.98);
            border: 1px solid rgba(168, 197, 160, 0.2);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 1000;
            min-width: 140px;
            backdrop-filter: blur(8px);
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            width: 100%;
            padding: 10px 16px;
            background: none;
            border: none;
            text-align: left;
            cursor: pointer;
            color: var(--cream);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .dropdown-item:hover {
            background: rgba(168, 197, 160, 0.15);
        }

        .dropdown-item.set-admin {
            color: #a8c5a0;
        }

        .dropdown-item.set-admin:hover {
            background: rgba(168, 197, 160, 0.2);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .participant-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--forest-light), var(--forest));
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .participant-avatar.admin-avatar {
            background: linear-gradient(135deg, #7a9e6e, #3a4f2c);
            box-shadow: 0 0 0 2px rgba(168, 197, 160, 0.45);
        }

        .participant-info {
            flex: 1;
            min-width: 0;
        }

        .participant-name {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: var(--white);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .participant-email {
            margin: 3px 0 0;
            font-size: 0.82rem;
            color: var(--sage);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border-radius: 999px;
            padding: 4px 11px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            align-self: flex-start;
            margin-top: 10px;
        }

        .role-badge.admin {
            background: rgba(168, 197, 160, 0.14);
            border: 1px solid rgba(168, 197, 160, 0.28);
            color: #a8c5a0;
        }

        .role-badge.user {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--sage);
        }

        .card-footer-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            margin-top: 10px;
            border-top: 1px solid rgba(168, 197, 160, 0.1);
            color: var(--sage);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .participant-card:hover .card-footer-link {
            color: var(--white);
        }

        .arrow-icon {
            font-size: 0.8rem;
            transition: transform 0.2s;
        }

        .participant-card:hover .arrow-icon {
            transform: translateX(4px);
        }

        .empty-state {
            background: rgba(58, 79, 44, 0.25);
            border: 1px dashed rgba(168, 197, 160, 0.25);
            border-radius: 18px;
            padding: 56px 24px;
            text-align: center;
            color: var(--sage);
            grid-column: 1 / -1;
        }

        .empty-state h3 {
            font-family: "DM Serif Display", serif;
            color: var(--white);
            margin-bottom: 10px;
        }

        .no-results-msg {
            display: none;
            color: var(--sage);
            text-align: center;
            padding: 40px 0;
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .page-layout {
                margin-left: 0;
            }

            .page-header {
                flex-direction: column;
                gap: 8px;
            }

            .page-title-wrap h1 {
                font-size: 1.8rem;
            }

            .participants-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <main class="page-layout">
        <nav class="topbar">
            <a href="/home" class="topbar-brand">Symbiosis</a>
            <a href="/home" class="topbar-back">
                <span class="back-arrow">←</span> Home
            </a>
        </nav>

        <div class="page-shell">

            <div class="page-header">
                <div class="page-title-wrap">
                    <h1>Participants</h1>
                    <p>Everyone taking part in the Symbiosis community.</p>
                    <span class="participant-count-badge">
                        <strong th:text="${#lists.size(participants)}">0</strong>&nbsp;members
                    </span>
                </div>
            </div>

            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search by name or email…"
                    autocomplete="off"
                >
            </div>

            <div class="filter-row" id="filterRow">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="user" th:if="${isAdmin}">Users</button>
                <button class="filter-tab" data-filter="admin" th:if="${isAdmin}">Admins</button>
            </div>

            <div class="participants-grid" id="participantsGrid">

                <div th:each="p : ${participants}" class="participant-card" th:attr="data-user-id=${p.id}, data-user-role=${p.role.toString().toLowerCase()}">
                    <div class="card-menu" th:if="${isAdmin and p.role.toString() != 'ADMIN'}">
                        <button class="menu-dots" onclick="event.stopPropagation()">⋮</button>
                        <div class="dropdown-menu">
                            <button class="dropdown-item set-admin" onclick="event.stopPropagation()">Set as Admin</button>
                        </div>
                    </div>
                    <a th:href="@{'/profile/' + ${p.id}}" class="card-link">
                        <div class="card-top">
                            <div class="participant-avatar"
                                 th:classappend="${p.role.toString() == 'ADMIN'} ? ' admin-avatar' : ''"
                                 th:text="${p.firstName != null and !#strings.isEmpty(p.firstName)} ? ${#strings.substring(p.firstName,0,1)} : 'U'">
                                U
                            </div>

                            <div class="participant-info">
                                <h3 class="participant-name"
                                    th:text="${p.firstName + ' ' + p.lastName}">
                                    Full Name
                                </h3>
                                <p class="participant-email" th:text="${p.email}">
                                    email@example.com
                                </p>
                            </div>
                        </div>

                        <span th:if="${isAdmin}"
                              class="role-badge"
                              th:classappend="${p.role.toString() == 'ADMIN'} ? ' admin' : ' user'"
                              th:text="${#strings.toLowerCase(p.role.toString())}">
                            user
                        </span>

                        <div class="card-footer-link">
                            <span>View profile</span>
                            <span class="arrow-icon">→</span>
                        </div>
                    </a>
                </div>

                <div class="empty-state" th:if="${participants == null or #lists.isEmpty(participants)}">
                    <h3>No participants yet</h3>
                    <p>Users will appear here once they join the community.</p>
                </div>

            </div>

            <p class="no-results-msg" id="noResultsMsg">No participants match your search.</p>

        </div>
    </main>

    <script>
        const searchInput   = document.getElementById('searchInput');
        const filterRow     = document.getElementById('filterRow');
        const grid          = document.getElementById('participantsGrid');
        const noResults     = document.getElementById('noResultsMsg');
        let cards = [];

        function updateCards() {
            cards = Array.from(grid.querySelectorAll('.participant-card:not(.empty-state)'));
        }
        updateCards();

        let activeFilter = 'all';

        if (filterRow) {
            filterRow.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    filterRow.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    activeFilter = tab.dataset.filter;
                    applyFilters();
                });
            });
        }

        if (searchInput) {
            searchInput.addEventListener('input', applyFilters);
        }

        function applyFilters() {
            updateCards();
            const query = searchInput.value.trim().toLowerCase();
            let visible = 0;

            cards.forEach(card => {
                const link = card.querySelector('.card-link');
                const nameElem = link ? link.querySelector('.participant-name') : null;
                const emailElem = link ? link.querySelector('.participant-email') : null;
                const name = (nameElem ? nameElem.innerText : '').toLowerCase();
                const email = (emailElem ? emailElem.innerText : '').toLowerCase();
                const role = card.dataset.userRole || '';

                const matchesSearch = !query || name.includes(query) || email.includes(query);
                const matchesFilter = activeFilter === 'all' || role === activeFilter;

                if (matchesSearch && matchesFilter) {
                    card.style.display = '';
                    visible++;
                } else {
                    card.style.display = 'none';
                }
            });

            if (noResults) {
                noResults.style.display = visible === 0 && cards.length > 0 ? 'block' : 'none';
            }
        }

        document.addEventListener('click', function() {
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                menu.classList.remove('show');
            });
        });

        document.querySelectorAll('.menu-dots').forEach(button => {
            button.addEventListener('click', (e) => {
                e.stopPropagation();
                const dropdown = button.nextElementSibling;
                document.querySelectorAll('.dropdown-menu').forEach(menu => {
                    if (menu !== dropdown) menu.classList.remove('show');
                });
                dropdown.classList.toggle('show');
            });
        });

        document.querySelectorAll('.set-admin').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const card = btn.closest('.participant-card');
                const userId = card.dataset.userId;
                try {
                    const response = await fetch('/participants/' + userId + '/set-admin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    if (response.ok) {
                        location.reload();
                    } else {
                        alert('Failed to set user as admin');
                    }
                } catch (error) {
                    alert('Error setting user as admin');
                }
                btn.closest('.dropdown-menu').classList.remove('show');
            });
        });
    </script>
</body>
</html>
